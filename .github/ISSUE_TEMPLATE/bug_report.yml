name: "Bug Report"
description: "Report a bug or unexpected behavior in dsh-call-session"
title: "[Bug]: "
labels: ["bug", "needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue. Please search existing issues before opening a new report and redact any credentials, tokens, or local home directory paths.

  - type: dropdown
    id: surface
    attributes:
      label: "Plugin Surface"
      description: "Which capability or subsystem is affected?"
      options:
        - "Unicast Call / Session Creation (session_call, session_create, session_query)"
        - "Public Blackboard (board_post, board_list, board_clear)"
        - "Collaboration Canvas (/session-canvas UI, lineage routing, viewport)"
        - "Peer Session Mention (@ composer trigger, two-level drill-down, dsh-session slice)"
        - "DSH Host Gateway / Cordis lifecycle activation"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: "Runtime Environment"
      description: "Plugin version, DeepSeek Harness version, Node.js version, and OS."
      placeholder: "dsh-call-session v0.1.33 / DSH v0.2.0 / Node v22.x / Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Observed Behavior"
      description: "Describe what happened, including tool return values, session states (running / idle / error), or canvas behavior."
      placeholder: "Calling session_call with targetSessionId returns..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Minimal steps or session configuration to reproduce the behavior."
      value: |
        1. Configure `dsh-call-session` in `cordis.patch.yml`
        2. Invoke tool or UI action: ...
        3. Observe output: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "Describe what should have happened according to the tool contract or ADR."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs / Redacted Output"
      description: "Relevant console output, stack traces, or redacted session payloads."
      render: shell
