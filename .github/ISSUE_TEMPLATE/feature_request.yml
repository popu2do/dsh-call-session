name: "Feature Request"
description: "Propose an enhancement for dsh-call-session"
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Submit proposals with concrete technical rationale and expected behavior.

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Motivation"
      description: "Describe the operational limitation or constraint this addresses."
      placeholder: "A clear and concise description of the problem..."
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed Solution"
      description: "Describe the functionality or change you would like to see."
      placeholder: "Add support for..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Solutions"
      description: "Describe any alternative solutions or workarounds considered."
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: "Any extra information, mockups, or API examples."
    validations:
      required: false
